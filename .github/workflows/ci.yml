# Type-checks, lints, tests and builds every package on each push and PR,
# so breakage shows up before a deploy. Tests use throwaway databases and a
# faked Meta API: no secrets or network access needed.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: war/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: war/scraper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      # The profile-reader tests drive the runner's preinstalled Chrome
      # against saved pages (fixtures/); nothing hits Instagram or TikTok.
      - run: npm test
